name: verify

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/**'
      - '**/*.html'
      - 'CHANGELOG.md'
      - 'SPEC.md'
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 校验合册与站点一致性
        run: python3 tools/verify.py
