name: live-check

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 检查线上站点
        run: python3 tools/check_live.py --all
